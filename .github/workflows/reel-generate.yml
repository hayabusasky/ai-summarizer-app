name: Generate Chibi-Boss reel for review

on:
  schedule:
    # 12:00 JST (UTC+9) == 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: reel-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-ipafont-gothic
          pip install pillow

      - run: npm install

      # reel/queue/ にある台本(Claude Codeが書いたもの)を1本取り出す。
      # キューが空なら generated=false で以降の手順をスキップする。
      # REEL_API_FALLBACK=true のときだけ、空のときにClaude APIで台本を自動作成する。
      - name: Pick next reel script
        id: gen
        run: npm run reel:generate
        env:
          REEL_API_FALLBACK: ${{ vars.REEL_API_FALLBACK || 'false' }}
          REEL_ALLOW_NO_BG: ${{ vars.REEL_ALLOW_NO_BG || 'false' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Render preview video
        if: steps.gen.outputs.generated == 'true'
        run: python3 reel/make_reel.py out/reel/script.json out/reel/reel.mp4

      - uses: actions/upload-artifact@v4
        if: steps.gen.outputs.generated == 'true'
        with:
          name: reel-preview
          path: out/reel/reel.mp4
          retention-days: 14

      - name: Open review issue
        if: steps.gen.outputs.generated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create reel --color C9A227 --description "チビボスのリール確認" --force
          gh label create reel-approved --color 2EA043 --description "付けるとInstagramに投稿" --force
          printf '\n---\n**プレビュー動画:** %s の Artifacts にある `reel-preview`\n' "$RUN_URL" >> out/reel/issue.md
          gh issue create --title "$(cat out/reel/title.txt)" --body-file out/reel/issue.md --label reel

      - name: Persist reel state and queue
        if: steps.gen.outputs.generated == 'true'
        run: |
          if [ -n "$(git status --porcelain -- data/reels.json reel/queue reel/done)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A -- data/reels.json reel/queue reel/done
            git commit -m "chore: update reel state [skip ci]"
            git pull --rebase
            git push
          fi
